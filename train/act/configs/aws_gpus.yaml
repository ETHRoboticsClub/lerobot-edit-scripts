# Single-GPU cluster profile (Hydra launch profile: gpus).
# Merge with job.yaml via train/act/train.sh (DEVICE_CONFIG + JOB_CONFIG).
checkpoint_dir: /checkpoints
num_machines: 1
multi_gpu: false
num_processes: 1
mixed_precision: bf16
dynamo_backend: inductor
batch_size: 48
steps: 2100
optimizer_lr: 6e-5
checkpoint_steps: 900
num_workers: 4
video_backend: torchcodec
policy_device: cuda
